<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: en Android el teclado achica el viewport en vez de
         taparlo — sin esto el composer del chat queda debajo del teclado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f6f3" />
    <!-- PWA: "Añadir a pantalla de inicio" abre el panel SIN la barra de
         Safari — pantalla completa de verdad, como una app. Es la única forma
         de quitar la píldora del URL que se cuela entre el chat y el teclado. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AutoVenta" />
    <title>AutoVenta</title>
    <!-- Bloque «AV» de AutoVenta, fijo: el número de tickets abiertos ya está
         en el menú y en la pestaña sobraba. -->
    <link rel="icon" type="image/svg+xml" href="autoventa-icono.svg" />
    <script type="module" crossorigin src="./assets/index-BhNUfLdm.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bne6sm3F.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
