<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: en Android el teclado achica el viewport en vez de
         taparlo — sin esto el composer del chat queda debajo del teclado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f1e4" />
    <!-- PWA: "Añadir a pantalla de inicio" abre el panel SIN la barra de
         Safari — pantalla completa de verdad, como una app. Es la única forma
         de quitar la píldora del URL que se cuela entre el chat y el teclado. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Depot Hub" />
    <title>Depot Tire · Hub</title>
    <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d62828'/%3E%3Crect x='2' y='2' width='60' height='60' rx='12' fill='none' stroke='%2314213d' stroke-width='4'/%3E%3Ctext x='32' y='42' font-family='Arial Black,sans-serif' font-size='24' font-weight='900' fill='white' text-anchor='middle'%3EDT%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Las 7 familias NO bloquean el pintado.
         Antes eran un <link rel="stylesheet"> normal: el navegador no dibujaba
         nada hasta traerlas de Google, y en el celular eso es medio segundo o
         más de pantalla en blanco (y con la red mala, mucho más). Con
         media="print" el navegador las baja sin bloquear y `onload` las activa;
         el texto aparece de inmediato en la tipografía del sistema y salta a la
         buena al llegar (que es lo que ya hacía display=swap). El <noscript>
         cubre el caso sin JS. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Archivo:wght@500;600;700;800&family=Archivo+Black&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Archivo:wght@500;600;700;800&family=Archivo+Black&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      // Tema por URL: /demo-showroom-gp/, /demo-neobrutalista/, /demo-showroom/, o ?theme= en dev.
      // Por defecto: Showroom GP (sistema oficial). ?theme=aurora conserva el
      // tema original Claude Oscuro × Aurora Glass como referencia histórica.
      (function () {
        var m =
          location.pathname.match(/demo-(showroom-gp|neobrutalista|racing|showroom)/) ||
          location.search.match(/theme=(showroom-gp|neobrutalista|racing|showroom|aurora)/);
        var theme = m ? m[1] : "showroom-gp";
        if (theme !== "aurora") document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-BUbYk1JT.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BXFFNnQJ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
