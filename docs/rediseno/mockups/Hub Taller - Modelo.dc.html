<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; }
    body { font-family: "Archivo", ui-sans-serif, system-ui, sans-serif; color: #1c1b19; background: #f7f6f3; -webkit-font-smoothing: antialiased; }
    a, a:hover { color: #1c1b19; }
    input::placeholder { color: #6f6b64; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  </style>
</helmet>

<sc-if value="{{ esEscritorio }}" hint-placeholder-val="{{ true }}">
<div data-screen-label="Escritorio" style="display:flex;height:100vh;background:#f7f6f3;overflow:hidden;">
  <aside style="width:224px;flex-shrink:0;display:flex;flex-direction:column;padding:22px 16px 20px;border-right:1px solid rgba(28,27,25,.10);box-sizing:border-box;">
    <div style="padding:0 12px 26px;display:flex;flex-direction:column;gap:2px;">
      <span style="font-size:15px;font-weight:600;letter-spacing:-.01em;">Depot Tire</span>
      <span style="font-size:12px;color:#6f6b64;">Hub de ventas</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px;">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="4">
        <button onClick="{{ n.ir }}" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;text-align:left;font-weight:{{ n.peso }};color:{{ n.color }};background:{{ n.bg }};" style-hover="background:rgba(28,27,25,.05);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" dangerouslySetInnerHTML="{{ n.svg }}"></svg>
          <span style="flex:1;">{{ n.label }}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;">{{ n.conteo }}</span>
        </button>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;">
      <button onClick="{{ toggleBot }}" title="Encender o apagar el bot" style="display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:6px;font-size:13px;text-align:left;color:{{ botColor }};" style-hover="background:rgba(28,27,25,.05);">
        <span style="width:8px;height:8px;border-radius:50%;margin:0 5px;background:{{ botDot }};"></span>
        <span style="flex:1;">{{ botTxt }}</span>
      </button>
      <button onClick="{{ toggleSonido }}" style="display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:6px;font-size:13px;text-align:left;color:#6f6b64;" style-hover="background:rgba(28,27,25,.05);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" dangerouslySetInnerHTML="{{ sonidoSvg }}"></svg>
        <span style="flex:1;">{{ sonidoTxt }}</span>
      </button>
      <button onClick="{{ irAjustes }}" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;font-size:14px;text-align:left;margin-top:6px;font-weight:{{ ajustesPeso }};color:{{ ajustesColor }};background:{{ ajustesBg }};" style-hover="background:rgba(28,27,25,.05);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span style="flex:1;">Ajustes</span>
      </button>
    </div>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 32px 22px;flex-wrap:wrap;">
      <div style="display:flex;align-items:baseline;gap:14px;min-width:0;">
        <h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;">{{ titulo }}</h1>
        <span style="font-size:13px;color:#6f6b64;">{{ subtitulo }}</span>
      </div>
      <sc-if value="{{ enInbox }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:8px;height:40px;width:min(360px,100%);padding:0 12px;border-radius:6px;background:#ffffff;border:1px solid rgba(28,27,25,.10);box-sizing:border-box;" style-focus-within="border-color:#1c1b19;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6f6b64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
          <input value="{{ q }}" onChange="{{ onQ }}" placeholder="Buscar por nombre, medida o vehículo" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font:inherit;font-size:13px;color:#1c1b19;">
          <sc-if value="{{ hayQ }}" hint-placeholder-val="{{ false }}"><button onClick="{{ limpiarQ }}" style="font-size:12px;color:#6f6b64;">Borrar</button></sc-if>
        </div>
      </sc-if>
    </header>

    <sc-if value="{{ enInbox }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;min-height:0;margin:0 32px 32px;border-radius:10px;background:#ffffff;border:1px solid rgba(28,27,25,.10);display:flex;flex-direction:column;overflow:hidden;">
        <div style="display:grid;grid-template-columns:minmax(120px,200px) 112px minmax(140px,1fr) 80px minmax(60px,124px);gap:16px;align-items:center;height:40px;padding:0 20px;font-size:12px;font-weight:500;color:#6f6b64;border-bottom:1px solid rgba(28,27,25,.10);">
          <span>Cliente</span><span>Medida</span><span>Último mensaje</span><span style="text-align:right;">Hora</span><span>Atiende</span>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto;">
          <sc-for list="{{ rows }}" as="t" hint-placeholder-count="10">
            <button onClick="{{ t.abrir }}" style="display:grid;width:100%;grid-template-columns:minmax(120px,200px) 112px minmax(140px,1fr) 80px minmax(60px,124px);gap:16px;align-items:center;height:56px;padding:0 20px;text-align:left;border-bottom:1px solid rgba(28,27,25,.10);box-sizing:border-box;background:{{ t.bg }};box-shadow:{{ t.sel }};" style-hover="background:rgba(28,27,25,.03);">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:{{ t.peso }};">{{ t.titulo }}</span>
              <sc-if value="{{ t.tieneMedida }}" hint-placeholder-val="{{ true }}">
                <span style="justify-self:start;display:inline-block;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;letter-spacing:-.01em;padding-bottom:2px;border-bottom:1px solid rgba(28,27,25,.35);font-variant-numeric:tabular-nums;white-space:nowrap;">{{ t.medidaA }} <b style="font-weight:700;">{{ t.medidaR }}</b></span>
              </sc-if>
              <sc-if value="{{ t.sinMedida }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:#6f6b64;">Sin medida</span></sc-if>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:{{ t.msgColor }};">{{ t.ultimoMensaje }}</span>
              <span style="text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:{{ t.horaPeso }};color:{{ t.horaColor }};font-variant-numeric:tabular-nums;white-space:nowrap;">{{ t.hora }}</span>
              <span style="font-size:13px;font-weight:{{ t.atiendePeso }};color:{{ t.atiendeColor }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ t.atiendeTxt }}</span>
            </button>
          </sc-for>
          <sc-if value="{{ sinResultados }}" hint-placeholder-val="{{ false }}">
            <div style="padding:48px 20px;text-align:center;font-size:13px;color:#6f6b64;">Nadie coincide con «{{ q }}».</div>
          </sc-if>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ enOtra }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;min-height:0;margin:0 32px 32px;border-radius:10px;background:#ffffff;border:1px solid rgba(28,27,25,.10);display:grid;place-items:center;font-size:13px;color:#6f6b64;">{{ titulo }} · pantalla pendiente de dibujar</div>
    </sc-if>
  </div>
</div>
</sc-if>

<sc-if value="{{ esTelefono }}" hint-placeholder-val="{{ false }}">
<div style="min-height:100vh;display:grid;place-items:center;background:#e9e7e2;padding:24px;box-sizing:border-box;">
<div data-screen-label="Teléfono" style="width:390px;height:844px;display:flex;flex-direction:column;background:#f7f6f3;color:#1c1b19;overflow:hidden;border-radius:10px;border:1px solid rgba(28,27,25,.10);box-shadow:0 12px 32px rgba(28,27,25,.12);box-sizing:border-box;">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:58px 20px 14px;">
    <div style="display:flex;flex-direction:column;gap:2px;">
      <h1 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;">{{ titulo }}</h1>
      <button onClick="{{ toggleBot }}" style="display:flex;align-items:center;gap:6px;font-size:12px;color:{{ botColor }};text-align:left;"><span style="width:7px;height:7px;border-radius:50%;background:{{ botDot }};"></span>{{ botTxt }}</button>
    </div>
    <div style="display:flex;align-items:center;gap:4px;">
      <button onClick="{{ toggleSonido }}" style="width:44px;height:44px;display:grid;place-items:center;color:#6f6b64;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" dangerouslySetInnerHTML="{{ sonidoSvg }}"></svg></button>
      <button onClick="{{ irAjustes }}" style="width:44px;height:44px;display:grid;place-items:center;color:{{ ajustesColor }};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
    </div>
  </header>
  <sc-if value="{{ enInbox }}" hint-placeholder-val="{{ true }}">
    <div style="margin:0 16px 12px;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:6px;background:#ffffff;border:1px solid rgba(28,27,25,.10);box-sizing:border-box;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6f6b64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
      <input value="{{ q }}" onChange="{{ onQ }}" placeholder="Nombre, medida o vehículo" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font:inherit;font-size:14px;color:#1c1b19;">
      <sc-if value="{{ hayQ }}" hint-placeholder-val="{{ false }}"><button onClick="{{ limpiarQ }}" style="font-size:12px;color:#6f6b64;">Borrar</button></sc-if>
    </div>
    <div style="flex:1;min-height:0;margin:0 16px;border-radius:10px 10px 0 0;background:#ffffff;border:1px solid rgba(28,27,25,.10);border-bottom:none;overflow-y:auto;">
      <sc-for list="{{ rows }}" as="t" hint-placeholder-count="8">
        <button onClick="{{ t.abrir }}" style="display:flex;width:100%;flex-direction:column;gap:5px;padding:12px 16px;text-align:left;border-bottom:1px solid rgba(28,27,25,.10);box-sizing:border-box;background:{{ t.bg }};box-shadow:{{ t.sel }};">
          <div style="display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:10px;">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:{{ t.peso }};">{{ t.titulo }}</span>
            <span style="flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:{{ t.horaPeso }};color:{{ t.horaColor }};font-variant-numeric:tabular-nums;">{{ t.hora }}</span>
          </div>
          <div style="display:flex;align-items:baseline;gap:12px;font-size:13px;">
            <sc-if value="{{ t.tieneMedida }}" hint-placeholder-val="{{ true }}">
              <span style="display:inline-block;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;letter-spacing:-.01em;padding-bottom:2px;border-bottom:1px solid rgba(28,27,25,.35);font-variant-numeric:tabular-nums;">{{ t.medidaA }} <b style="font-weight:700;">{{ t.medidaR }}</b></span>
            </sc-if>
            <sc-if value="{{ t.sinMedida }}" hint-placeholder-val="{{ false }}"><span style="color:#6f6b64;">Sin medida</span></sc-if>
            <span style="font-weight:{{ t.atiendePeso }};color:{{ t.atiendeColor }};">{{ t.atiendeTxt }}</span>
          </div>
          <span style="max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:{{ t.msgColor }};">{{ t.ultimoMensaje }}</span>
        </button>
      </sc-for>
      <sc-if value="{{ sinResultados }}" hint-placeholder-val="{{ false }}">
        <div style="padding:48px 20px;text-align:center;font-size:13px;color:#6f6b64;">Nadie coincide con «{{ q }}».</div>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ enOtra }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;margin:0 16px;border-radius:10px 10px 0 0;background:#ffffff;border:1px solid rgba(28,27,25,.10);border-bottom:none;display:grid;place-items:center;font-size:13px;color:#6f6b64;">{{ titulo }} · pendiente</div>
  </sc-if>
  <nav style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 8px 28px;border-top:1px solid rgba(28,27,25,.10);background:#f7f6f3;">
    <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="4">
      <button onClick="{{ n.ir }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;height:48px;justify-content:center;font-size:11px;font-weight:{{ n.peso }};color:{{ n.color }};">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" dangerouslySetInnerHTML="{{ n.svg }}"></svg>{{ n.label }}
      </button>
    </sc-for>
  </nav>
</div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;dispositivo&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;escritorio&quot;, &quot;telefono&quot;], &quot;default&quot;: &quot;escritorio&quot;, &quot;tsType&quot;: &quot;\&quot;escritorio\&quot; | \&quot;telefono\&quot;&quot;, &quot;section&quot;: &quot;Vista&quot;}, &quot;urgenteId&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 9, &quot;min&quot;: 1, &quot;max&quot;: 18, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Inbox&quot;}}">
class Component extends DCLogic {
  state = { data: null, vista: "inbox", q: "", sonido: true, bot: true, sel: null };
  componentDidMount() {
    import("./hub-data.js").then((m) => this.setState({ data: m }));
  }
  renderVals() {
    const m = this.state.data;
    const { vista, q, sonido, bot, sel } = this.state;
    const dispositivo = this.props.dispositivo ?? "escritorio";
    const urgenteId = this.props.urgenteId ?? 9;
    const BRICK = "#b4453a", INK = "#1c1b19", MUTED = "#6f6b64";
    const ICONS = {
      inbox: { __html: '<path d="M3 13h4l2 3h6l2-3h4"/><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/>' },
      pipeline: { __html: '<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>' },
      cotizador: { __html: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.4"/><path d="M12 3.5v3"/><path d="M12 17.5v3"/><path d="M3.5 12h3"/><path d="M17.5 12h3"/><path d="m6 6 2.1 2.1"/><path d="m15.9 15.9 2.1 2.1"/><path d="m18 6-2.1 2.1"/><path d="m8.1 15.9-2.1 2.1"/>' },
      metricas: { __html: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/>' },
    };
    const TITULOS = {
      inbox: ["Inbox", ""], pipeline: ["Pipeline", "Las etapas de venta, en vivo"],
      cotizador: ["Cotizador", "Inventario y precios reales"], metricas: ["Métricas", "El negocio de un vistazo"],
      ajustes: ["Ajustes", "Negocio, seguimientos, avisos y usuarios"],
    };
    const total = m ? m.TICKETS.length : 18;
    const navItems = ["inbox", "pipeline", "cotizador", "metricas"].map((id) => {
      const activo = vista === id;
      return {
        id, label: TITULOS[id][0], svg: ICONS[id],
        conteo: id === "inbox" ? String(total) : "",
        peso: activo ? 600 : 500, color: activo ? BRICK : INK,
        bg: activo && dispositivo === "escritorio" ? "rgba(180,69,58,.07)" : "transparent",
        ir: () => this.setState({ vista: id }),
      };
    });
    let rows = [], sinResultados = false;
    if (m) {
      const now = Date.now(), hoy = new Date(now).toDateString();
      const texto = q.trim().toLowerCase();
      rows = m.TICKETS.filter((t) => !texto || `${t.nombre ?? ""} ${t.telefono} ${t.medida ?? ""} ${t.vehiculo ?? ""}`.toLowerCase().includes(texto))
        .map((t) => {
          const urgente = t.id === urgenteId, sinLeer = t.sinLeer > 0, seleccionado = sel === t.id;
          const d = new Date(t.ultimaActividad);
          const [medidaA, medidaR] = t.medida ? t.medida.split(" ") : ["", ""];
          return {
            ...t, titulo: t.nombre ?? t.telefono,
            tieneMedida: Boolean(t.medida), sinMedida: !t.medida, medidaA, medidaR,
            bg: urgente ? "rgba(180,69,58,.07)" : "transparent",
            sel: seleccionado ? `inset 3px 0 0 ${BRICK}` : "none",
            peso: sinLeer || urgente ? 600 : 500,
            msgColor: sinLeer || urgente ? INK : MUTED,
            hora: d.toDateString() === hoy ? m.horaCorta(d) : `ayer ${m.horaCorta(d)}`,
            horaPeso: urgente ? 700 : 500, horaColor: urgente ? BRICK : MUTED,
            atiendeTxt: urgente ? "Espera respuesta" : t.atiende === "bot" ? "Bot" : "Andrés",
            atiendePeso: urgente ? 600 : 400, atiendeColor: urgente ? BRICK : MUTED,
            abrir: () => this.setState({ sel: seleccionado ? null : t.id }),
          };
        });
      sinResultados = rows.length === 0;
    }
    const enInbox = vista === "inbox";
    const [titulo, sub] = TITULOS[vista];
    return {
      esEscritorio: dispositivo === "escritorio", esTelefono: dispositivo === "telefono",
      navItems, rows, sinResultados, q, hayQ: q.length > 0,
      onQ: (e) => this.setState({ q: e.target.value }), limpiarQ: () => this.setState({ q: "" }),
      enInbox, enOtra: !enInbox, titulo,
      subtitulo: enInbox ? `${total} conversaciones abiertas · 1 espera respuesta` : sub,
      botTxt: bot ? "Bot contestando" : "Bot apagado — nadie contesta",
      botDot: bot ? "#2f6f4f" : BRICK, botColor: bot ? INK : BRICK,
      toggleBot: () => this.setState({ bot: !bot }),
      sonidoTxt: sonido ? "Sonido activado" : "Silencio",
      sonidoSvg: sonido
        ? { __html: '<path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4Z"/><path d="M15.6 9.4a3.7 3.7 0 0 1 0 5.2"/><path d="M18.2 6.8a7.3 7.3 0 0 1 0 10.4"/>' }
        : { __html: '<path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4Z"/><path d="m16 9.8 5 4.4"/><path d="M21 9.8l-5 4.4"/>' },
      toggleSonido: () => this.setState({ sonido: !sonido }),
