      <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#6f6b64;"><span style="font-family:'JetBrains Mono',monospace;font-weight:700;color:#1c1b19;">D</span>Medida como marca · 245/40</div>
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="width:36px;height:36px;border-radius:6px;display:grid;place-items:center;background:#1c1b19;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M2.8 11a9.2 9.2 0 0 1 18.4 0" stroke="#ffffff" stroke-width="2.6" stroke-dasharray="2 1.2"></path><text x="12" y="21" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" letter-spacing="-.6" fill="#ffffff">AV</text><circle cx="12" cy="10.5" r="1.3" fill="#b4453a"></circle></svg></span>
